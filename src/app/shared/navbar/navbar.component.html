<nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <!-- Logo -->
      <a routerLink="/plants" class="flex items-center gap-2">
        <span class="text-3xl">🌱</span>

        <span class="text-2xl font-bold text-green-700"> GardenCare </span>
      </a>

      <!-- Navigation -->
      <div class="hidden md:flex items-center gap-6">
        <!-- Plants -->
        <a
          routerLink="/plants"
          routerLinkActive="text-green-700 font-semibold"
          class="text-gray-600 hover:text-green-600 transition"
        >
          Plants
        </a>

        <!-- Products -->
        <a
          routerLink="/products"
          routerLinkActive="text-green-700 font-semibold"
          class="text-gray-600 hover:text-green-600 transition"
        >
          Products
        </a>

        <!-- Articles -->
        <a
          routerLink="/articles"
          routerLinkActive="text-green-700 font-semibold"
          class="text-gray-600 hover:text-green-600 transition"
        >
          Articles
        </a>

        <!-- About -->

        <a
          routerLink="/about"
          routerLinkActive="text-green-700 font-semibold"
          class="text-gray-600 hover:text-green-600 transition"
        >
          About
        </a>

        <!-- ⭐ ADMIN LINK GOES HERE -->
        @if (isAdmin()) {
          <a
            routerLink="/admin"
            routerLinkActive="text-green-700 font-semibold"
            class="text-gray-600 hover:text-green-600 transition"
          >
            Admin
          </a>
        }

        <!-- Logged-in User -->
        @if (isLoggedIn()) {
          <!-- Orders -->
          <a
            routerLink="/orders"
            routerLinkActive="text-green-700 font-semibold"
            class="text-gray-600 hover:text-green-600 transition"
          >
            My Orders
          </a>

          <!-- Cart -->
          <a
            routerLink="/cart"
            class="text-gray-600 hover:text-green-600 transition"
          >
            🛒 Cart
          </a>

          <button
            (click)="logout()"
            class="rounded-lg bg-red-500 px-4 py-2 text-sm font-medium text-white hover:bg-red-600 transition"
          >

          </button>
        }

        <!-- Logged-out User -->
        @else {
          <a
            routerLink="/login"
            class="rounded-lg border border-green-600 px-4 py-2 text-green-600 hover:bg-green-50"
          >

          </a>

          <a
            routerLink="/register"
            class="rounded-lg bg-green-600 px-4 py-2 text-white hover:bg-green-700"
